# SonarCloud project identity. agentirc is analysed by SonarCloud's automatic
# analysis (the GitHub App), not by a CI scan step, so this file is not read by
# a scanner. scripts/sonar-pr-issues.py reads sonar.projectKey from it to find
# the PR's analysis and its unresolved issues.
sonar.projectKey=agentculture_agentirc
sonar.organization=agentculture
